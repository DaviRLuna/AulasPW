<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        div{
            background-color: rgb(219, 199, 174);
            border: solid black 5px;
            border-radius: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        body{
            width: vw;
            height: 100vh;
            display: flex;
            flex-direction: row;
            gap: 30px;
        }
        body div {
            width: 50%;
        }
    </style>
</head>

<body>
    <script>
        const catalagoProdutos = [
            ['Iphone 17 pro max', 'Iphone 17 pro max" 64GB de RAM', 'Smartphone', 3535.86],
            ['PS5 pro', 'PS5 pro" 16 de RAM', 'Videogame', 4564.98],
            ['Notebook lenovo', 'Notebook lenovo" 8 de RAM', 'Notebook', 3967.98]
        ];

        catalagoProdutos.forEach(produtos =>{
            const Caixa = document.createElement('div');
            const Produto = document.createElement('p');

            produtos.forEach((index, iten) =>{
                console.log(index);
                const tag = iten === 0 ? 'h1' : 'p';
                const PRODUTO  = document.createElement(tag);
                PRODUTO.innerText = index;
                Caixa.appendChild(PRODUTO);
           })
           document.body.appendChild(Caixa);
        });
    </script>
</body>
</html>
